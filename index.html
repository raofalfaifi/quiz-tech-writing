<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technical Writing Quiz — اختبار الكتابة التقنية</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1c1f26; --muted:#667085; --border:#dfe3ec;
  --accent:#2f5dff; --accent-soft:#e8edff; --ok:#16a34a; --ok-bg:#e7f8ee; --bad:#dc2626; --bad-bg:#fdeaea;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12141a; --card:#1b1e27; --text:#e8eaf0; --muted:#98a0b3; --border:#2c3140;
    --accent:#6f8dff; --accent-soft:#232a44; --ok:#34d27b; --ok-bg:#12301f; --bad:#ff6b6b; --bad-bg:#3a1a1a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.ar{direction:rtl;text-align:right}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .25s}
.q-en{font-size:1.15rem;font-weight:600;margin:0}
.q-ar{font-size:1.1rem;margin:6px 0 18px;color:var(--muted);direction:rtl;text-align:right}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 14px;font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .t{flex:1;unicode-bidi:plaintext}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong .k{background:var(--bad);color:#fff}
.exp{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);
  border-inline-start:4px solid var(--accent);direction:rtl;text-align:right}
.exp b{display:block;margin-bottom:2px}
.verdict{font-weight:700;margin-top:14px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;
  background:var(--accent);color:#fff}
button.btn.sec{background:transparent;color:var(--text);border:1.5px solid var(--border)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
label.chk{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}
.score{font-size:3rem;font-weight:800;margin:6px 0;color:var(--accent)}
.rev{border-top:1px solid var(--border);padding:14px 0}
.rev .en{font-weight:600} .rev .a{color:var(--muted);direction:rtl;text-align:right}
.rev .y{color:var(--bad)} .rev .c{color:var(--ok)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- Start screen -->
  <div id="start" class="card">
    <h1>Technical Writing Quiz</h1>
    <p class="sub ar">اختبار الكتابة التقنية — 100 سؤال مع شرح عربي بعد كل إجابة</p>
    <label class="chk"><input type="checkbox" id="shQ"> Shuffle questions — ترتيب الأسئلة عشوائي</label>
    <label class="chk"><input type="checkbox" id="shO"> Shuffle choices — ترتيب الخيارات عشوائي</label>
    <label class="chk">
      Part — الجزء:&nbsp;
      <select id="part">
        <option value="all">All 100 — كل الأسئلة</option>
        <option value="1">Lecture 1 (1–25) — المحاضرة 1</option>
        <option value="2">Lecture 2 (26–50) — المحاضرة 2</option>
        <option value="3">Lecture 3 (51–75) — المحاضرة 3</option>
        <option value="4">Extra (76–100) — أسئلة إضافية</option>
      </select>
    </label>
    <div class="row"><button class="btn" id="startBtn">Start — ابدأ</button></div>
  </div>

  <!-- Quiz screen -->
  <div id="quiz" class="card hide">
    <div class="top"><span id="counter"></span><span id="scoreLive"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <p class="q-en" id="qen"></p>
    <p class="q-ar" id="qar"></p>
    <div class="opts" id="opts"></div>
    <div id="feedback"></div>
    <div class="row"><button class="btn hide" id="nextBtn">Next — التالي</button></div>
  </div>

  <!-- Result screen -->
  <div id="result" class="card hide">
    <h1>Result — النتيجة</h1>
    <div class="score" id="finalScore"></div>
    <p class="sub" id="finalMsg"></p>
    <div class="row">
      <button class="btn" id="retryAll">Restart — إعادة الاختبار</button>
      <button class="btn sec" id="retryWrong">Retry mistakes — إعادة الأخطاء فقط</button>
    </div>
    <h2 style="margin-top:26px;font-size:1.1rem">Mistakes review — مراجعة الأخطاء</h2>
    <div id="review"></div>
  </div>

</div>

<script>
/* ---------- Data ---------- */
const M=(q,a,o,c,e)=>({q,a,o,c,e});
const T=(q,a,v,e)=>({q,a,o:[`True — صح`,`False — خطأ`],c:v?0:1,e,tf:true});

const QUESTIONS=[
/* ===== Lecture 1 ===== */
M(`Which of the following is NOT one of the four major categories of technical writing?`,
  `أي مما يلي ليس من الفئات الرئيسية الأربع للكتابة التقنية؟`,
  [`Reports and communications in day-to-day business — التقارير والاتصالات في الأعمال اليومية`,
   `Patents — براءات الاختراع`,
   `Operational manuals, instructions, or procedures — أدلة التشغيل أو التعليمات أو الإجراءات`,
   `Novels and poetry — الروايات والشعر`],3,
  `الفئات الأربع: تقارير الأعمال، الأوراق والكتب والرسائل العلمية، البراءات، الأدلة والإجراءات. الروايات والشعر ليست منها.`),
T(`A technical report is mostly written by engineers.`,
  `التقرير التقني يكتبه في الغالب مهندسون.`,true,`صح، حسب الشريحة.`),
T(`The purpose of a technical report is to recommend, instruct, inform or persuade a reader about a specific practical matter.`,
  `الغرض من التقرير التقني هو أن يوصي القارئ أو يوجّهه أو يُعلمه أو يقنعه بشأن أمر عملي محدد.`,true,
  `صح: recommend / instruct / inform / persuade.`),
M(`Which of the following is NOT one of the ten attributes of technical writing?`,
  `أي مما يلي ليس من السمات العشر للكتابة التقنية؟`,
  [`It is impersonal — غير شخصية`,
   `It is archival — أرشيفية (تُحفظ للمستقبل)`,
   `It is entertaining — ترفيهية`,
   `It is concise — موجزة`],2,
  `التقرير التقني لا يهدف للتسلية (not intended to entertain).`),
M(`Which group of verbs is probably associated with factual statements?`,
  `أي مجموعة من الأفعال ترتبط غالبًا بالعبارات الواقعية (الحقائق)؟`,
  [`Think, suppose — يظن، يفترض`,
   `Determined, completed, discovered — حُدِّد، اكتمل، اكتُشف`,
   `May be, appear — ربما، يبدو`,
   `Suggest, think — يقترح، يظن`],1,
  `أفعال الحقائق: determined, solved, built, completed, discovered. أما think/suppose/appear/suggest فليست حقائق.`),
T(`Words such as "suppose" and "think" are good for presenting facts in technical writing.`,
  `كلمات مثل «suppose» و«think» مناسبة لعرض الحقائق في الكتابة التقنية.`,false,
  `خطأ، هي أفعال غير مرتبطة بالحقائق.`),
T(`The use of first person pronouns such as "I" is encouraged in technical writing.`,
  `يُشجَّع استخدام ضمائر المتكلم مثل «I» في الكتابة التقنية.`,false,
  `خطأ. الكتابة التقنية Impersonal (ضمير الغائب)، واستخدام «I» يضعف المصداقية.`),
M(`In an industrial situation, the objective of any work is usually to:`,
  `في الوضع الصناعي، يكون هدف أي عمل عادةً:`,
  [`Entertain the reader — تسلية القارئ`,
   `Make or increase profits — تحقيق الأرباح أو زيادتها`,
   `Train new employees — تدريب الموظفين الجدد`,
   `Avoid writing reports — تجنب كتابة التقارير`],1,
  `Objective = السبب العام للعمل، وفي الصناعة غالبًا هو زيادة الأرباح.`),
M(`"Reducing the failure rate to less than three ppm" in the latch example is the report's:`,
  `«خفض نسبة الفشل إلى أقل من ثلاثة أجزاء في المليون» في مثال القفل هو ما يسمى في التقرير:`,
  [`Purpose — الغرض`,
   `Objective — الهدف`,
   `Scope — النطاق`,
   `Appendix — الملحق`],1,
  `الغرض (purpose) = عرض نتائج الدراسة، والهدف (objective) = خفض نسبة الفشل لتوفير المال.`),
M(`The appropriate style for technical writing is:`,
  `الأسلوب المناسب للكتابة التقنية هو:`,
  [`Emotional — عاطفي`,
   `Opinionated — متحيز للرأي`,
   `Objective — موضوعي`,
   `Humorous — فكاهي`],2,
  `الأسلوب موضوعي وغير متحيز (objective).`),
T(`Style is the way that you write, while format is the ordering and physical layout of a document.`,
  `الأسلوب هو طريقة كتابتك، أما التنسيق فهو ترتيب المستند وتخطيطه الشكلي.`,true,
  `صح: Style = طريقة الكتابة، Format = الترتيب والتنسيق.`),
M(`In a formal technical report, which element answers "what you did"?`,
  `في التقرير التقني الرسمي، أي عنصر يجيب عن سؤال «ماذا فعلت؟»`,
  [`Introduction — المقدمة`,
   `Procedure — الإجراءات`,
   `Results — النتائج`,
   `Recommendations — التوصيات`],1,
  `Introduction: why / Procedure: what you did / Results: what happened.`),
T(`Technical documents should be generated on transient issues that will not be pertinent in the future.`,
  `يجب إعداد المستندات التقنية حول قضايا عابرة لن تكون ذات صلة في المستقبل.`,false,
  `خطأ. الكتابة التقنية Archival فلا تُكتب عن مواضيع عابرة.`),
M(`Which of the following is NOT a type of technical study listed in Figure 2?`,
  `أي مما يلي ليس من أنواع الدراسات التقنية المذكورة في الشكل 2؟`,
  [`Solving problems — حل المشكلات`,
   `Failure analysis — تحليل الفشل`,
   `Feasibility study — دراسة الجدوى`,
   `Writing a novel — كتابة رواية`],3,
  `الأنواع: حل مشكلات، بحث آلية، تطوير شيء جديد، دراسة جدوى، تحليل فشل.`),
T(`Solutions to technical problems should be data driven, not based on intuition, experience or opinion.`,
  `يجب أن تعتمد حلول المشكلات التقنية على البيانات، لا على الحدس أو الخبرة أو الرأي.`,true,`صح.`),
M(`Which type of technical study may be the toughest assignment?`,
  `أي نوع من الدراسات التقنية قد يكون أصعب مهمة؟`,
  [`Feasibility study — دراسة الجدوى`,
   `Develop something new — تطوير شيء جديد`,
   `Failure analysis — تحليل الفشل`,
   `Research a mechanism — بحث آلية`],1,
  `Develop something new: احتمال النجاح أقل، والإدارة تطلب عمليًا اختراعًا.`),
M(`The purpose of a feasibility study is usually to:`,
  `الغرض من دراسة الجدوى عادةً هو:`,
  [`Build the product — بناء المنتج`,
   `Gather facts to make business decisions — جمع الحقائق لاتخاذ قرارات تجارية`,
   `Train workers — تدريب العمال`,
   `Test materials only — اختبار المواد فقط`],1,
  `Feasibility = جمع حقائق لاتخاذ قرارات تجارية.`),
M(`In materials engineering, all parts fail by one or a combination of which three processes?`,
  `في هندسة المواد، تفشل كل القطع بإحدى العمليات الثلاث التالية أو بمزيج منها:`,
  [`Wear, corrosion, fracture — البلى، التآكل (الصدأ)، الكسر`,
   `Heat, cold, light — الحرارة، البرودة، الضوء`,
   `Noise, vibration, pressure — الضوضاء، الاهتزاز، الضغط`,
   `Design, cost, time — التصميم، التكلفة، الوقت`],0,
  `wear / corrosion / fracture: تتآكل، تصدأ، أو تنكسر.`),
M(`In a failure analysis study, which step comes right after "Analyzing acquired data"?`,
  `في دراسة تحليل الفشل، أي خطوة تأتي مباشرة بعد «تحليل البيانات المكتسبة»؟`,
  [`Planning the investigation — تخطيط التحقيق`,
   `Testing the hypothesis — اختبار الفرضية`,
   `Acquiring background information — جمع المعلومات الخلفية`,
   `Testing (chemical analysis) — الاختبار (التحليل الكيميائي)`],1,
  `الترتيب: خلفية، تخطيط، اختبار، تحليل بيانات، اختبار الفرضية، تقرير نهائي.`),
M(`The first step of an engineering project is to:`,
  `الخطوة الأولى في المشروع الهندسي هي:`,
  [`Write the report — كتابة التقرير`,
   `Analyze data — تحليل البيانات`,
   `State the problem (get all details) — تحديد المشكلة (الحصول على كل التفاصيل)`,
   `Perform more studies — إجراء دراسات إضافية`],2,
  `الخطوة 1: State the problem، والأخيرة (9): Write report.`),
M(`The main reason for writing a project proposal is to:`,
  `السبب الرئيسي لكتابة مقترح المشروع هو:`,
  [`Get support and funding to proceed — الحصول على الدعم والتمويل للمتابعة`,
   `Archive old data — أرشفة البيانات القديمة`,
   `Replace the final report — استبدال التقرير النهائي`,
   `Entertain management — تسلية الإدارة`],0,
  `بعد وجود الفكرة تحتاج دعمًا وتمويلًا.`),
M(`Which is the correct set of the three basic elements of a writing strategy?`,
  `أي مجموعة تمثل العناصر الأساسية الثلاثة لاستراتيجية الكتابة؟`,
  [`Readership, scope, purpose and objectives — القراء، النطاق، الغرض والأهداف`,
   `Title, date, author — العنوان، التاريخ، المؤلف`,
   `Abstract, body, references — الملخص، المتن، المراجع`,
   `Cost, time, quality — التكلفة، الوقت، الجودة`],0,
  `Readership = who / Scope = what / Purpose & objectives = why.`),
M(`The summary (executive summary / abstract) represents about how much of the written report?`,
  `الملخص (الملخص التنفيذي / abstract) يمثل تقريبًا كم من التقرير المكتوب؟`,
  [`50% — 50٪`,`25% — 25٪`,`10% — 10٪`,`1% — 1٪`],2,
  `الملخص حوالي 10٪ من التقرير.`),
T(`The conclusion of a report should introduce new information.`,
  `يجب أن تقدم خاتمة التقرير معلومات جديدة.`,false,
  `خطأ. الخاتمة لا تضيف معلومات جديدة (Do not introduce new information).`),
M(`Plagiarism is defined as:`,
  `يُعرَّف الانتحال (Plagiarism) بأنه:`,
  [`Citing sources in APA style — توثيق المصادر بنمط APA`,
   `The act of claiming the words or ideas of another person as your own — نسب كلمات أو أفكار شخص آخر لنفسك`,
   `Paraphrasing with a citation — إعادة الصياغة مع التوثيق`,
   `Writing a long report — كتابة تقرير طويل`],1,
  `الانتحال = نسب كلمات أو أفكار شخص آخر لنفسك.`),

/* ===== Lecture 2 ===== */
M(`Experts are the audience group who:`,
  `الخبراء (Experts) هم فئة القراء الذين:`,
  [`Build and repair equipment — يبنون المعدات ويصلحونها`,
   `Know the theory and the product inside and out and have advanced degrees — يعرفون النظرية والمنتج بعمق ولديهم شهادات عليا`,
   `Make business decisions — يتخذون القرارات التجارية`,
   `Have the least technical knowledge — لديهم أقل معرفة تقنية`],1,
  `Experts: دكاترة وباحثون يعرفون النظرية والمنتج.`),
M(`Technicians are the audience group who:`,
  `الفنيون (Technicians) هم فئة القراء الذين:`,
  [`Build, operate, maintain, and repair what the experts design — يبنون ويشغلون ويصينون ويصلحون ما يصممه الخبراء`,
   `Make political decisions — يتخذون قرارات سياسية`,
   `Only read newspapers — يقرأون الصحف فقط`,
   `Write patents only — يكتبون البراءات فقط`],0,
  `Technicians = فنيون ينفذون ويشغلون ويصينون.`),
M(`Which audience group has the least technical knowledge of all?`,
  `أي فئة من القراء لديها أقل معرفة تقنية على الإطلاق؟`,
  [`Experts — الخبراء`,
   `Technicians — الفنيون`,
   `Executives — المديرون التنفيذيون`,
   `Non-specialists — غير المتخصصين`],3,
  `Non-specialists = غير المتخصصين.`),
T(`A good report satisfies the needs and demands of the audience.`,
  `التقرير الجيد يلبي احتياجات القراء ومتطلباتهم.`,true,`صح.`),
M(`If a report is intended for a countless and varied audience, it should be written so that:`,
  `إذا كان التقرير موجهًا لجمهور كبير ومتنوع، فيجب أن يُكتب بحيث:`,
  [`Only experts are satisfied — يُرضي الخبراء فقط`,
   `No area is ignored and it satisfies them all — لا يُهمل أي مجال ويُرضي الجميع`,
   `Only management is addressed — يخاطب الإدارة فقط`,
   `It is as short as possible — يكون أقصر ما يمكن`],1,
  `يُكتب بحيث لا يُهمل أي مجال ويُرضي الجميع.`),
M(`Writing is hierarchical when it is arranged:`,
  `تكون الكتابة هرمية (hierarchical) عندما تُرتَّب:`,
  [`Randomly — عشوائيًا`,
   `From abstract (high level) to concrete (low level) — من المجرد (مستوى عالٍ) إلى الملموس (مستوى منخفض)`,
   `Only in tables — في جداول فقط`,
   `Only in bullet points — في نقاط فقط`],1,
  `Cascade: من مستوى عالٍ مجرد إلى تفاصيل أدق.`),
M(`It is uncommon to go further than which level of headings in most technical documentation?`,
  `من غير الشائع تجاوز أي مستوى من العناوين في معظم الوثائق التقنية؟`,
  [`Second — الثاني`,`Third — الثالث`,`Fourth — الرابع`,`Tenth — العاشر`],2,
  `نادرًا ما يتجاوز المستند المستوى الرابع.`),
M(`When writing for multiple audiences simultaneously, which tone should be adopted?`,
  `عند الكتابة لعدة فئات من القراء في الوقت نفسه، أي نبرة يجب اعتمادها؟`,
  [`The most informal tone — النبرة الأكثر غير رسمية`,
   `The most formal tone — النبرة الأكثر رسمية`,
   `A humorous tone — نبرة فكاهية`,
   `No tone — بلا نبرة`],1,
  `تُتبنى أكثر نبرة رسمية (مثال: incident report يُبنى كما تتطلب الجهات الحكومية).`),
T(`Deciding on the audience early in the writing process reduces later rewriting effort.`,
  `تحديد القراء مبكرًا في عملية الكتابة يقلل جهد إعادة الكتابة لاحقًا.`,true,`صح.`),
M(`Compared to technical readers, nontechnical readers require:`,
  `مقارنةً بالقراء التقنيين، يحتاج القراء غير التقنيين إلى:`,
  [`Less explanation of introductory concepts — شرح أقل للمفاهيم التمهيدية`,
   `More explanation of introductory concepts — شرح أكثر للمفاهيم التمهيدية`,
   `No introduction — بلا مقدمة`,
   `More equations — معادلات أكثر`],1,

/* ---------- State ---------- */
const $=id=>document.getElementById(id);
let list=[], idx=0, score=0, wrongs=[], locked=false;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const show=id=>["start","quiz","result"].forEach(x=>$(x).classList.toggle("hide",x!==id));

function prepare(src,shQ,shO){
  let arr=src.map(q=>({...q}));
  if(shO){
    arr=arr.map(q=>{
      if(q.tf) return q;
      const order=shuffle(q.o.map((_,i)=>i));
      return {...q,o:order.map(i=>q.o[i]),c:order.indexOf(q.c)};
    });
  }
  return shQ?shuffle(arr):arr;
}

function begin(src){
  list=src; idx=0; score=0; wrongs=[];
  show("quiz"); render();
}

function render(){
  locked=false;
  const q=list[idx];
  $("counter").textContent=`Question ${idx+1} / ${list.length} — السؤال ${idx+1} من ${list.length}`;
  $("scoreLive").textContent=`Score — النتيجة: ${score}`;
  $("prog").style.width=(idx/list.length*100)+"%";
  $("qen").textContent=`${idx+1}. ${q.q}`;
  $("qar").textContent=q.a;
  $("feedback").innerHTML="";
  $("nextBtn").classList.add("hide");
  $("nextBtn").textContent=idx===list.length-1?"Finish — إنهاء":"Next — التالي";
  const box=$("opts"); box.innerHTML="";
  q.o.forEach((txt,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    const k=document.createElement("span"); k.className="k"; k.textContent=String.fromCharCode(65+i);
    const t=document.createElement("span"); t.className="t"; t.textContent=txt;
    b.append(k,t);
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
}

function answer(i){
  if(locked) return; locked=true;
  const q=list[idx];
  const btns=[...$("opts").children];
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(j===q.c) b.classList.add("correct");
    else if(j===i) b.classList.add("wrong");
  });
  const ok=i===q.c;
  if(ok) score++; else wrongs.push({q,picked:i});
  $("scoreLive").textContent=`Score — النتيجة: ${score}`;
  const f=$("feedback");
  f.innerHTML="";
  const v=document.createElement("div");
  v.className="verdict "+(ok?"ok":"no");
  v.textContent=ok?"✓ Correct — إجابة صحيحة":"✗ Incorrect — إجابة خاطئة";
  const e=document.createElement("div");
  e.className="exp";
  e.innerHTML="<b>الشرح:</b>";
  e.append(document.createTextNode(q.e));
  f.append(v,e);
  $("nextBtn").classList.remove("hide");
  $("nextBtn").focus();
}

function next(){
  if(idx<list.length-1){idx++;render();}
  else finish();
}

function finish(){
  $("prog").style.width="100%";
  show("result");
  const pct=Math.round(score/list.length*100);
  $("finalScore").textContent=`${score} / ${list.length}  (${pct}%)`;
  $("finalMsg").textContent=pct>=90?"ممتاز! — Excellent!":pct>=75?"جيد جدًا — Very good":pct>=50?"جيد، راجع الأخطاء — Fair, review your mistakes":"تحتاج مراجعة أكثر — Needs more review";
  $("retryWrong").classList.toggle("hide",wrongs.length===0);
  const r=$("review"); r.innerHTML="";
  if(!wrongs.length){r.textContent="No mistakes — لا توجد أخطاء 🎉";return;}
  wrongs.forEach(({q,picked})=>{
    const d=document.createElement("div"); d.className="rev";
    const en=document.createElement("div"); en.className="en"; en.textContent=q.q;
    const a=document.createElement("div"); a.className="a"; a.textContent=q.a;
    const y=document.createElement("div"); y.className="y"; y.textContent="✗ "+q.o[picked];
    const c=document.createElement("div"); c.className="c"; c.textContent="✓ "+q.o[q.c];
    const e=document.createElement("div"); e.className="ar"; e.textContent=q.e;
    d.append(en,a,y,c,e); r.appendChild(d);
  });
}

/* ---------- Events ---------- */
$("startBtn").onclick=()=>{
  const p=$("part").value;
  let src=QUESTIONS;
  if(p!=="all"){const s=(+p-1)*25; src=QUESTIONS.slice(s,s+25);}
  begin(prepare(src,$("shQ").checked,$("shO").checked));
};
$("nextBtn").onclick=next;
$("retryAll").onclick=()=>show("start");
$("retryWrong").onclick=()=>begin(prepare(wrongs.map(w=>w.q),$("shQ").checked,$("shO").checked));
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide")) return;
  if(!locked && /^[1-4]$/.test(e.key)){const n=+e.key-1; if(n<list[idx].o.length) answer(n);}
  else if(locked && e.key==="Enter") next();
});
</script>
